name: Recalibrate own forecast model (weekly)

# Le modèle de prévision maison (Forecast for Trading) est une régression
# calibrée sur ~120j d'historique météo/réalisé. Sans recalibration
# périodique, le modèle se fige et devient obsolète à mesure que le mix de
# capacité installée évolue (nouveaux parcs, mises hors service, etc.).
# Recalibration hebdomadaire — largement suffisant vu la vitesse
# d'évolution du parc allemand (pas besoin de la faire aussi souvent que
# le rafraîchissement horaire de la prévision elle-même).

on:
  schedule:
    - cron: "0 5 * * 1"  # chaque lundi 05h00 UTC
  workflow_dispatch: {}

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Call calibrate-own-forecast endpoint
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X GET "https://meridian-power.vercel.app/api/admin/calibrate-own-forecast?days=120" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi
